{% extends 'assessments/base.html' %}{% block content %}<h2>{{ assessment.title }}</h2><p>{{ assessment.description }}</p><div class="list-group">{% for q in assessment.questions.all %}<a class="list-group-item list-group-item-action d-flex justify-content-between" href="{% url 'coding_page' q.id %}"><span>{{ forloop.counter }}. {{ q.title }}</span><span>{{ q.marks }} marks →</span></a>{% endfor %}</div>{% endblock %}
