{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Assessment</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{% static 'css/site.css' %}" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-primary px-4"><a class="navbar-brand fw-bold" href="{% url 'landing' %}">Smart Assessment</a><div class="ms-auto d-flex align-items-center gap-2"><button type="button" class="btn btn-outline-light btn-sm" onclick="history.back()">← Back</button>{% if user.is_authenticated %}<a class="btn btn-outline-light btn-sm" href="{% url 'dashboard' %}">Dashboard</a><span class="text-white">{{ user.username }}</span><a class="btn btn-light btn-sm" href="{% url 'logout' %}">Logout</a>{% endif %}</div></nav><main class="container py-4">{% for message in messages %}<div class="alert alert-{% if message.tags == 'success' %}success{% else %}danger{% endif %}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
