{% extends 'assessments/base.html' %}{% block content %}<div class="card login-card mx-auto shadow-sm"><div class="card-body p-4"><h2>Sign in</h2><form method="post">{% csrf_token %}<input class="form-control my-3" name="username" placeholder="Username" required><input class="form-control my-3" type="password" name="password" placeholder="Password" required><select class="form-select my-3" name="role"><option value="faculty" {% if request.GET.role == 'faculty' %}selected{% endif %}>Faculty</option><option value="student" {% if request.GET.role == 'student' %}selected{% endif %}>Student</option></select><button class="btn btn-primary w-100">Login</button></form><p class="text-center mt-3 mb-0">New here? <a href="{% url 'signup' %}">Create an account</a></p></div></div>{% endblock %}
